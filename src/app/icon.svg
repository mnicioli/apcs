  <!--
    O FAVICON DA APCS.

    É o mesmo desenho de public/logo-apcs.svg — os cinco paths abaixo saíram
    dele sem uma vírgula de diferença. O que muda é o enquadramento, e muda por
    necessidade: o logo oficial é 146x80, quase 2:1. Numa aba de navegador ele
    entra num quadrado de 16px, e uma marca 2:1 centralizada num quadrado vira
    uma tarja vermelha de 16x9 onde não se lê nada.

    Por isso a marca vem em BRANCO sobre a ladrilho vermelho institucional
    (#C4262E, o mesmo do arquivo original) em vez de vermelha sobre transparente:
    a 16px quem identifica a aba é a cor cheia, não o traço. O desenho continua
    lá, legível a partir de 32px.

    A transformação é uma cadeia lida da direita para a esquerda:
    translate(-2 -11) leva o viewBox do original ("2 11 146 80") para a origem,
    scale(0.5205) reduz 146 para 76 de largura, e o translate final centraliza.
  -->
